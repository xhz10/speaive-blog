# IP 访问入口（域名备案未通过时，走纯 IP 访问 80 端口）
# 访问地址：http://<服务器公网IP>
# 设为 80 端口 default_server：用 IP 访问（Host 不匹配任何域名）时命中此站点
#
# 部署：
#   sudo cp blog-ip.conf /etc/nginx/sites-available/blog-ip
#   sudo ln -sf /etc/nginx/sites-available/blog-ip /etc/nginx/sites-enabled/blog-ip
#   sudo nginx -t && sudo systemctl reload nginx
# 走 HTTP/IP 时记得把 .env 的 SPEAIVE_SECURE_COOKIES 设为 false（见 docs/deployment.md §7）。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 图片上传上限：后端 SPEAIVE_MAX_IMAGE_BYTES=8MiB，留余量
    client_max_body_size 9m;

    location / {
        proxy_pass http://127.0.0.1:9266;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
