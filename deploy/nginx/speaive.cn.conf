# 域名入口：HTTP 301 跳 HTTPS，HTTPS 反代到前端容器。
# 把 speaive.cn 换成你自己的域名，证书路径相应替换。
#
# 部署：
#   sudo cp speaive.cn.conf /etc/nginx/sites-available/speaive.cn
#   sudo ln -sf /etc/nginx/sites-available/speaive.cn /etc/nginx/sites-enabled/speaive.cn
#   sudo nginx -t && sudo systemctl reload nginx

# HTTP -> HTTPS
server {
    listen 80;
    server_name speaive.cn www.speaive.cn;
    return 301 https://$server_name$request_uri;
}

# HTTPS 反代到 speaive-blog 前端容器（Astro SSR）
# /api/*、/media/* 由前端容器内部转发到后端，nginx 只需整体反代。
server {
    listen 443 ssl http2;
    server_name speaive.cn www.speaive.cn;

    ssl_certificate     /etc/nginx/ssl/speaive.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/speaive.cn.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    client_max_body_size 9m;

    location / {
        proxy_pass http://127.0.0.1:9266;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
